<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="RIESGO INTEGRAL Bogotá PTIA 2026">
  <defs>
    <linearGradient id="pinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E75B6"/>
      <stop offset="1" stop-color="#1F3864"/>
    </linearGradient>
    <clipPath id="pinClip">
      <path id="pinPath" d="M156,150 A54,54 0 1 0 264,150 C264,212 210,290 210,290 C210,290 156,212 156,150 Z"/>
    </clipPath>
  </defs>

  <rect width="640" height="360" fill="#FFFFFF"/>

  <!-- map pin (territorY) -->
  <use href="#pinPath" fill="url(#pinGrad)"/>
  <ellipse cx="196" cy="126" rx="20" ry="12" fill="#FFFFFF" opacity="0.18"/>

  <!-- pulse / heart line (health) inside the pin -->
  <g clip-path="url(#pinClip)">
    <path d="M174,158 L206,158 L222,108 L240,206 L252,158 L266,158"
          fill="none" stroke="#FFFFFF" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- warm accent on the pulse spike -->
  <circle cx="222" cy="108" r="10" fill="#C55A11"/>
  <circle cx="222" cy="108" r="22" fill="none" stroke="#C55A11" opacity="0.35" stroke-width="2"/>

  <!-- wordmark -->
  <text x="300" y="158" font-family="'Segoe UI', Arial, sans-serif" font-size="46"
        font-weight="700" fill="#1F3864" letter-spacing="3">RIESGO INTEGRAL</text>
  <text x="301" y="202" font-family="'Segoe UI', Arial, sans-serif" font-size="24"
        font-weight="500" fill="#2E75B6" letter-spacing="1">Bogotá · PTIA 2026</text>
  <rect x="302" y="222" width="96" height="7" rx="3.5" fill="#C55A11"/>
</svg>
